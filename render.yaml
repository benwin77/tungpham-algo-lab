services:
  - type: web
    name: tungpham-algo-lab
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_PASSWORD
        value: tungpham8888
      - key: PYTHON_VERSION
        value: 3.11.8
